name: CI
on: [push, pull_request]
jobs:
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cd desktop/frontend && npm ci && npm run build
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          args: ./...
          working-directory: beamsync
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          args: ./...
          working-directory: desktop

  lint-svelte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: cd desktop/frontend && npm ci && npm run lint

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cd desktop/frontend && npm ci && npm run build
      - run: (cd beamsync && go test ./...)
      - run: (cd desktop && go test ./...)

  test-svelte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: cd desktop/frontend && npm ci && npm run test

  build:
    runs-on: ubuntu-latest
    needs: [lint-go, lint-svelte, test-go, test-svelte]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cd desktop/frontend && npm ci && npm run build
      - run: (cd beamsync && go build ./...)
      - run: (cd desktop && go build ./...)
