name: Sync PR Labels from Linked Issues

on:
  pull_request:
    types: [opened, reopened, edited]

permissions:
  pull-requests: write
  issues: read

jobs:
  sync-labels:
    name: Copy labels from linked issue
    runs-on: ubuntu-latest
    steps:
      - name: Sync labels
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const match = body.match(/(?:close|fix|resolve)(?:s|d)?\s*:?\s*#(\d+)/i);

            if (!match) {
              console.log('No linked issue found in PR body');
              return;
            }

            const issueNumber = parseInt(match[1], 10);
            console.log(`Linked issue: #${issueNumber}`);

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            if (!issue.labels || issue.labels.length === 0) {
              console.log('No labels on linked issue');
              return;
            }

            const labels = issue.labels.map(l => l.name);
            console.log(`Copying labels from #${issueNumber}:`, labels);

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels,
            });

            console.log(`Labels synced to PR #${context.issue.number}`);
